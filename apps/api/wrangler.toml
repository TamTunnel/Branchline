# Branchline API worker — Cloudflare deployment config.
# See DEPLOY.md for the credential + provisioning checklist.
# Local dev does NOT use this file (use `npm run dev` in apps/api with .dev.vars).

name = "branchline"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# BL_TOKEN = ""  # prefer `wrangler secret put BL_TOKEN`; repo-scoped API token, optional

# --- D1: branch registry, intent manifests, merge-queue state ---------------
[[d1_databases]]
binding = "DB"
database_name = "branchline"
database_id = "FILL_ME__wrangler_d1_create_branchline"  # then: wrangler d1 execute branchline --file=../../schema/001_init.sql
# Apply in order: schema/001_init.sql, schema/002_merge_sha.sql

# --- KV: diff-response cache (1h TTL) ---------------------------------------
# The worker falls back to a process-local Map when this binding is absent,
# so KV is optional — but bind it in production for cross-instance caching.
[[kv_namespaces]]
binding = "DIFF_CACHE"
id = "FILL_ME__wrangler_kv_namespace_create_DIFF_CACHE"

# --- Queues: merge jobs ------------------------------------------------------
# POST /api/merge sends to the queue when MERGE_QUEUE is bound (202 queued);
# the consumer below processes each job. Local dev has no queue binding and
# processes merges inline instead.
[[queues.producers]]
binding = "MERGE_QUEUE"
queue = "branchline-merge"

[[queues.consumers]]
queue = "branchline-merge"
max_batch_size = 1
max_retries = 2

# --- Artifacts: git backend (FUTURE — not implemented yet) -------------------
# The worker's GitBackend interface is backend-agnostic. Today only
# LocalGitBackend exists (needs a git working repo: local dev / self-hosted).
# The production backend will be implemented against the Artifacts Workers
# binding (git repos as a service), selected automatically when bound.
# Until then, leave this commented out — binding ARTIFACTS makes the worker
# fail loudly rather than silently misbehave.
#
# [[artifacts]]
# binding = "ARTIFACTS"
# namespace = "default"   # create/manage via the Artifacts dashboard or API
