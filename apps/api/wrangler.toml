name = "branchline"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# REPO_PATH = "/path/to/working/repo"   # set via .dev.vars locally, secret-free

[[d1_databases]]
binding = "DB"
database_name = "branchline"
database_id = "local-dev"

# Production merge jobs run on Queues; local dev processes the queue inline.
[[queues.producers]]
binding = "MERGE_QUEUE"
queue = "branchline-merge"

[[queues.consumers]]
queue = "branchline-merge"
max_batch_size = 1
